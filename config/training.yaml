# Training configuration for scripts/train.py
# Run with: python scripts/train.py --config config/training.yaml
# Any field can be overridden via CLI, e.g.:
#   python scripts/train.py --config config/training.yaml --mode cluster --index 1
#   python scripts/train.py --config config/training.yaml --no-evaluation

# Training mode: "local" (interactive, small run) or "cluster" (HPC, full run)
mode: local

# Index into the VARIANTS table (selects algorithm + environment combination)
#   0 - DDPG, image observation, net [64,64], PER, device=cuda
#   1 - DDPG, ray observation, net [16,16], PER, device=cpu
index: 0

# Run version number – used to distinguish separate training runs for the same variant
run_vers: 0

# Explicit output path.  Leave as null to auto-derive from index + run_vers:
#   ./Model/training/variant-<index>/run<run_vers>
path: null

# Set to true to load the best saved SB3 archive and evaluate instead of training.
# Unlike a dataclass-only launch, this supplied YAML defaults to evaluation.
# Use --no-evaluation when loading this YAML to train.
evaluation: true

# Total environment steps for training.
# Leave as null to use mode-dependent defaults (1e5 for local, 7e6 for cluster).
tot_timesteps: null

# Number of parallel environments
n_cpu: 20
