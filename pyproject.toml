[project]
name = "multiagent-drlmpc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "casadi>=3.7.2",
    "setuptools<82",
    "opengen>=0.9.4",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "opencv-python>=4.13.0.92",
    "pyvisgraph>=0.2.1",
    "scipy>=1.17.0",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
    "gymnasium>=1.2.3",
    "stable-baselines3>=2.7.1",
    "tyro>=1.0.13",
    "rich>=15.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
